services:
  wrapper:
    image: ghcr.io/hereisderek/alacarte-wrapper:latest
    build:
      context: ./wrapper
      dockerfile: Dockerfile
    pull_policy: build
    container_name: alacarte-wrapper
    # Wrapper binary + upstream rootfs are amd64-only. Pinning the platform makes
    # the build/run path explicit on arm64 hosts (Apple Silicon emulates via Rosetta).
    platform: linux/amd64
    volumes:
      # ALACARTE_DATA_PATH lets hosts like Portainer (which resolve ./ per stack)
      # keep settings and the Apple session at a fixed absolute path.
      - ${ALACARTE_DATA_PATH:-./data}/wrapper:/app/rootfs/data
      # The chroot dev/ ships empty (.gitkeep only); the Android runtime needs
      # working device nodes.  Explicit bind-mounts work on both Docker and Podman.
      - /dev/null:/app/rootfs/dev/null
      - /dev/urandom:/app/rootfs/dev/urandom
      - /dev/random:/app/rootfs/dev/random
      - /dev/zero:/app/rootfs/dev/zero
    # Copy the container runtime's DNS config into the Android chroot, then run
    # the supervisor, which passes argv to the wrapper and serves the sign-in
    # control API on 40020 (internal network only).
    entrypoint: ["/app/wrapper-entrypoint.sh"]
    environment:
      - LD_PRELOAD=/app/libwrapper_login_fix.so
    expose:
      - "10020"
      - "20020"
      - "30020"
      - "40020"
    networks:
      - alacarte-net
    # The supervisor restarts the wrapper itself; this only covers the
    # supervisor crashing.
    restart: on-failure

  web:
    image: ghcr.io/hereisderek/alacarte-web:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: build
    container_name: alacarte-web
    # Upstream apple-music-downloader image is published amd64-only.
    platform: linux/amd64
    depends_on:
      - wrapper
    environment:
      - PORT=7373
      - AMDL_WRAPPER_HOST=alacarte-wrapper
      - AMDL_WRAPPER_DECRYPT_PORT=10020
      - AMDL_WRAPPER_M3U8_PORT=20020
      - AMDL_WRAPPER_ACCOUNT_PORT=30020
      - AMDL_WRAPPER_SUPERVISOR_PORT=40020
      - AMDL_MUSIC_PATH=/music
      - AMDL_CONFIG_DIR=/config
      - AMDL_SECRET_KEY=${AMDL_SECRET_KEY:-}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      # Shared secret the importer service (see below) uses to call
      # /api/internal/*. Leave unset if you're not running the importer —
      # that surface 503s without it. Set the same value for both services.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      # Minimum gap (ms) the importer's /api/internal/search calls are spaced
      # apart at — the shared choke point protecting your Apple Music session's
      # catalog-search quota from ANY caller, not just the importer. See
      # backend/lib/requestSpacer.mjs. Raise this if you still see 429s at the
      # default; lower it if you have headroom to spare.
      - INTERNAL_SEARCH_MIN_INTERVAL_MS=${INTERNAL_SEARCH_MIN_INTERVAL_MS:-1500}
    volumes:
      - ${ALACARTE_DATA_PATH:-./data}/web:/config
      - ${MUSIC_PATH:?Set MUSIC_PATH in .env}:/music
    # Default (WEB_BIND unset/empty) publishes on all interfaces — same as
    # docker's default. Set WEB_BIND=127.0.0.1 in .env to restrict the UI to
    # the host machine only when fronting with a reverse proxy.
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-7373}:7373"
    networks:
      - alacarte-net
    restart: unless-stopped

  # Optional public-facing batch import front-end (see importer/README.md).
  # Off by default — `docker compose --profile importer up` to include it.
  # It never talks to `web` over the published port; it calls the internal
  # /api/internal/* surface over this same docker network instead, so `web`
  # itself never needs to be exposed publicly for the importer to work.
  importer:
    image: ghcr.io/hereisderek/alacarte-importer:latest
    build:
      context: .
      dockerfile: importer/Dockerfile
      args:
        VITE_BASE_PATH: ${IMPORTER_BASE_PATH:-/}
    container_name: alacarte-importer
    profiles: ["importer"]
    depends_on:
      - web
    environment:
      - PORT=8080
      - BASE_PATH=${IMPORTER_BASE_PATH:-/}
      - BACKEND_URL=http://alacarte-web:7373
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env to enable the importer}
      - AUTH_ENABLED=${IMPORTER_AUTH_ENABLED:-false}
      - IMPORTER_USERNAME=${IMPORTER_USERNAME:-import}
      - IMPORTER_PASSWORD=${IMPORTER_PASSWORD:-}
      - IMPORTER_SESSION_SECRET=${IMPORTER_SESSION_SECRET:-}
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
      # Extra client-side pacing/retry margin on top of the backend's own
      # spacing above — see importer/lib/importSession.mjs and
      # importer/lib/backendClient.mjs. Rarely need to change these.
      - IMPORTER_SEARCH_PACING_MS=${IMPORTER_SEARCH_PACING_MS:-500}
      - IMPORTER_MAX_429_RETRIES=${IMPORTER_MAX_429_RETRIES:-6}
      - IMPORTER_MAX_BACKOFF_MS=${IMPORTER_MAX_BACKOFF_MS:-20000}
      # User-Agent sent to each source. IMPORTER_USER_AGENT is the generic
      # fallback; each parser can be overridden individually (only set the
      # ones you need — unset falls back to IMPORTER_USER_AGENT, then a
      # built-in default). See importer/lib/userAgent.mjs.
      - IMPORTER_USER_AGENT=${IMPORTER_USER_AGENT:-}
      - SPOTIFY_USER_AGENT=${SPOTIFY_USER_AGENT:-}
      - QISHUI_USER_AGENT=${QISHUI_USER_AGENT:-}
      - KKBOX_USER_AGENT=${KKBOX_USER_AGENT:-}
      - SILVERBOX_USER_AGENT=${SILVERBOX_USER_AGENT:-}
      - HOLIDAY_USER_AGENT=${HOLIDAY_USER_AGENT:-}
    ports:
      - "${IMPORTER_BIND:-0.0.0.0}:${IMPORTER_PORT:-8090}:8080"
    networks:
      - alacarte-net
    restart: unless-stopped

networks:
  alacarte-net:
    name: ${DOCKER_NETWORK:-alacarte-net}
    external: ${DOCKER_NETWORK_EXTERNAL:-false}
