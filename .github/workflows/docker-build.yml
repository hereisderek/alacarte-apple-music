name: Build and Publish Containers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - '.gitignore'
      - 'LICENSE'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish All Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 1. Wrapper Container
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata for Wrapper
        id: meta-wrapper
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alacarte-wrapper
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push Wrapper image
        uses: docker/build-push-action@v6
        with:
          context: ./wrapper
          file: ./wrapper/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-wrapper.outputs.tags }}
          labels: ${{ steps.meta-wrapper.outputs.labels }}
          cache-from: type=gha,scope=wrapper
          cache-to: type=gha,mode=max,scope=wrapper

      # -----------------------------------------------------------------------
      # 2. Web Container
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alacarte-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # -----------------------------------------------------------------------
      # 3. Importer Container (shares local BuildKit daemon & base image cache)
      # -----------------------------------------------------------------------
      - name: Extract Docker metadata for Importer
        id: meta-importer
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/alacarte-importer
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and push Importer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./importer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-importer.outputs.tags }}
          labels: ${{ steps.meta-importer.outputs.labels }}
          cache-from: type=gha,scope=importer
          cache-to: type=gha,mode=max,scope=importer
