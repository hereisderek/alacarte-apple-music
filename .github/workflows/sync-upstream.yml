name: Sync Upstream

on:
  schedule:
    - cron: '0 3 * * *' # Daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote and Fetch
        run: |
          git remote add upstream https://github.com/sosjalapeno/alacarte.git
          git fetch upstream main

      - name: Check for Upstream Changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found in upstream."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Merge Upstream Changes
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          echo "Merging upstream/main into main..."
          if git merge upstream/main -m "chore(upstream): sync with upstream sosjalapeno/alacarte"; then
            echo "merge_success=true" >> $GITHUB_OUTPUT
          else
            echo "Merge conflict detected."
            echo "merge_success=false" >> $GITHUB_OUTPUT
            git merge --abort || true
            exit 1
          fi

      - name: Push Changes
        if: steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success == 'true'
        run: |
          git push origin main

      - name: Report Merge Conflict
        if: failure() && steps.check.outputs.has_changes == 'true' && steps.merge.outputs.merge_success != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream Sync Conflict Detected" \
            --body "Automated upstream synchronization with \`sosjalapeno/alacarte:main\` encountered merge conflicts. Please resolve manually by pulling upstream \`main\` into your branch."
